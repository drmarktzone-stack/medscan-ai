name: Deploy standalone site (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Build static app without Base44 credits
        env:
          VITE_STANDALONE: "true"
          VITE_LOCAL_CLINIC: "true"
          VITE_BIT_MERCHANT_PHONE: ${{ secrets.BIT_MERCHANT_PHONE }}
          VITE_VISION_PRICE_ILS: ${{ vars.VISION_PRICE_ILS || '49' }}
          VITE_VISION_UNLOCK_CODE: ${{ secrets.VISION_UNLOCK_CODE }}
          VITE_VISION_PAYWALL: ${{ vars.VISION_PAYWALL || 'true' }}
          VITE_VISION_SUBSCRIPTION_DAYS: ${{ vars.VISION_SUBSCRIPTION_DAYS || '30' }}
          VITE_STRIPE_PAYMENT_LINK: ${{ secrets.STRIPE_PAYMENT_LINK }}
          VITE_FREEAI_BIT_PHONE: "0528885800"
          VITE_FREEAI_SUPPORT_WHATSAPP: "972528885800"
          VITE_FREEAI_DEMO_PRO: "true"
          VITE_GROQ_API_KEY: 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
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          if [ "$REPO" = "${OWNER}.github.io" ]; then
            export VITE_BASE="/"
            export VITE_FREEAI_PUBLIC_URL="https://${OWNER}.github.io"
          else
            export VITE_BASE="/${REPO}/"
            export VITE_FREEAI_PUBLIC_URL="https://${OWNER}.github.io/${REPO}"
          fi
          echo "VITE_BASE=$VITE_BASE"
          npm run build:standalone
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
