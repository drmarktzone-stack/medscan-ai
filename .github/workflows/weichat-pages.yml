name: WeiChat Pages

on:
  push:
    branches: [main]
    paths:
      - 'wechat-app/**'
      - '.github/workflows/weichat-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: weichat-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: wechat-app/package-lock.json

      - name: Install & build
        working-directory: wechat-app
        env:
          VITE_RELAY_URL: ${{ secrets.VITE_RELAY_URL }}
        run: |
          npm ci
          npm test
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: wechat-app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
